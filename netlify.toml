# This repo is the already-built site (no package.json), so there is nothing to build.
# The no-op command overrides any build command set in the Netlify UI.
[build]
  command = "echo 'Static site: no build step'"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Function source isn't meant to be browsed.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
